    {% extends "home.html" %}
    {% block content %}
    <center><H2>Список продуктов</H2></center>
    <p>
    <div class="row text-center">
        {%for item in products%}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Удобный сервис рассылок</h4>
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title">$ {{ item.price }}</h1>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>- <H1>{{ item.name_prod }}</H1></li>
                        <li>- {{ item.category }}</li>
                        <li>- Установка на сервер</li>
                        <li>- Получение обновлений</li>
                    </ul>
                    <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
                </div>
            </div>
        </div>
        {%endfor%}
    </div>
    {% endblock %}
